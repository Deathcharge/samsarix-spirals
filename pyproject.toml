[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "samsarix-spirals"
version = "0.1.0"
description = "Deterministic JSON workflow contracts for local development and CI"
readme = "README.md"
requires-python = ">=3.11"
license = "MPL-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
  { name = "Andrew John Ward", email = "contact@samsarix.com" },
  { name = "Samsarix LLC", email = "contact@samsarix.com" },
]
maintainers = [
  { name = "Samsarix LLC", email = "support@samsarix.com" },
]
keywords = ["automation", "ci", "cli", "contract-testing", "json", "workflow"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "bandit>=1.8,<2",
  "build>=1.2,<2",
  "mypy>=1.11,<2",
  "pip-audit>=2.9,<3",
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.8,<1",
  "twine>=5,<7",
]

[project.scripts]
samsarix-spirals = "samsarix_spirals.cli:main"

[project.urls]
Repository = "https://github.com/Deathcharge/samsarix-spirals"
Issues = "https://github.com/Deathcharge/samsarix-spirals/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
samsarix_spirals = ["py.typed"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -ra --cov=samsarix_spirals --cov-branch --cov-report=term-missing --cov-fail-under=95"
testpaths = ["tests"]

[tool.coverage.run]
source = ["samsarix_spirals"]
omit = ["src/samsarix_spirals/__main__.py"]

[tool.coverage.report]
exclude_also = [
  "if TYPE_CHECKING:",
  "raise AssertionError",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "S", "SIM", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["samsarix_spirals"]
mypy_path = "src"
