name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest
      - if: matrix.python-version == '3.11'
        run: python -m ruff format --check .
      - if: matrix.python-version == '3.11'
        run: python -m ruff check .
      - if: matrix.python-version == '3.11'
        run: python -m mypy
      - if: matrix.python-version == '3.11'
        run: python -m bandit -q -r src
      - if: matrix.python-version == '3.11'
        run: python -m bandit -q tools/release_check.py
      - if: matrix.python-version == '3.11'
        run: python -m pip_audit .
      - if: matrix.python-version == '3.11'
        run: python -m pip_audit -r requirements/build.lock

  build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python -m venv /tmp/samsarix-spirals-smoke
      - run: /tmp/samsarix-spirals-smoke/bin/python -m pip install --no-deps dist/*.whl
      - run: /tmp/samsarix-spirals-smoke/bin/python -I tests/installed_smoke.py
      - run: /tmp/samsarix-spirals-smoke/bin/samsarix-spirals validate examples/hello.json
      - run: /tmp/samsarix-spirals-smoke/bin/samsarix-spirals explain examples/agent-tool-result.json --compact
      - run: /tmp/samsarix-spirals-smoke/bin/samsarix-spirals run examples/hello.json --input examples/hello.input.json --compact
      - run: /tmp/samsarix-spirals-smoke/bin/samsarix-spirals test examples/release-policy.json examples/release-policy.suite.json --json --compact
      - run: /tmp/samsarix-spirals-smoke/bin/samsarix-spirals test examples/release-policy.json examples/release-policy.suite.json --junit
      - run: /tmp/samsarix-spirals-smoke/bin/samsarix-spirals test examples/agent-tool-result.json examples/agent-tool-result.suite.json --json --compact
      - run: /tmp/samsarix-spirals-smoke/bin/samsarix-spirals run examples/agent-tool-result.json --input examples/agent-tool-result.input.json --output-only --compact
      - run: /tmp/samsarix-spirals-smoke/bin/samsarix-spirals test examples/repository-policy.json examples/repository-policy.suite.json --json --compact
      - run: /tmp/samsarix-spirals-smoke/bin/samsarix-spirals schema workflow --compact
      - run: /tmp/samsarix-spirals-smoke/bin/samsarix-spirals schema suite --compact

  reproducible-build:
    name: Candidate / ${{ matrix.os }}
    needs: test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
      - name: Build twice with hash-pinned tools and smoke-test installed candidate
        shell: pwsh
        run: |
          $builderDir = Join-Path $env:RUNNER_TEMP 'samsarix-builder'
          python -m venv $builderDir
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $pythonPath = if ($IsWindows) { 'Scripts/python.exe' } else { 'bin/python' }
          $builderPython = Join-Path $builderDir $pythonPath
          & $builderPython -m pip install --require-hashes --only-binary=:all: -r requirements/build.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $candidateDir = Join-Path $env:RUNNER_TEMP 'samsarix-candidate'
          & $builderPython -I tools/release_check.py --output-dir $candidateDir
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain candidate artifacts and unsigned verification evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: candidate-${{ runner.os }}-${{ github.sha }}
          path: ${{ runner.temp }}/samsarix-candidate/
          if-no-files-found: error
          retention-days: 14
